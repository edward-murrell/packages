# Central settings for your package repository.
# Edit these once; every script and the generated setup packages read from here.

# Short lowercase id. Used for file names on users' machines:
#   /etc/apt/sources.list.d/<id>.sources, /etc/yum.repos.d/<id>.repo,
#   and the setup packages <id>-archive-keyring (deb) and <id>-release (rpm).
REPO_ID="edward-murrell"

# Human-readable name shown by apt/dnf and on the landing page.
REPO_LABEL="Edward Murrell packages"

# Where the repo is served. For GitHub Pages: https://<user>.github.io/<this-repo-name>
# (no trailing slash). If you later move to a custom domain, change it here and bump
# SETUP_PKG_VERSION so existing users are switched over automatically.
BASE_URL="https://edward-murrell.github.io/packages"

# Maintainer line for the setup packages.
MAINTAINER="Edward Murrell <edward@murrell.co.nz>"

# Bump whenever the signing key, BASE_URL or repo files above change.
SETUP_PKG_VERSION="1.0.0"

# How many recent releases per project to keep in the repo (lets users downgrade).
KEEP_RELEASES=3

# Include GitHub pre-releases? (true/false)
INCLUDE_PRERELEASES=false

# ── Debian family ────────────────────────────────────────────────────────────
# One APT suite per supported release, named by its codename. Projects build a
# .deb for each and mark it with a "+<codename>" version suffix, e.g. 1.2.0+noble.
# Linux Mint and LMDE use their base release automatically:
#   jammy    Ubuntu 22.04   Mint 21.x
#   noble    Ubuntu 24.04   Mint 22.x
#   bookworm Debian 12      LMDE 6
#   trixie   Debian 13      LMDE 7
SUITES="jammy noble bookworm trixie"
COMPONENT="main"
ARCHES="amd64 arm64"

# ── RPM family ───────────────────────────────────────────────────────────────
# Nothing to configure: RPMs are sorted by their dist tag (.el9 -> rpm/9,
# .el10 -> rpm/10, .fc44 -> rpm/44) and dnf picks the folder via $releasever.
