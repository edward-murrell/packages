name: Publish package repository

# Rebuilds the whole repository from the projects' GitHub releases and deploys it
# to GitHub Pages. Nothing binary is ever committed to git.
on:
  workflow_dispatch:          # triggered by each project's release workflow, or by hand
  push:
    branches: [main]
    paths:
      - repo.conf
      - projects.txt
      - scripts/**
      - setup/**
      - .github/workflows/publish.yml
  schedule:
    - cron: "17 3 * * *"      # nightly safety net in case a trigger was missed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  NFPM_VERSION: "2.48.0"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq apt-utils createrepo-c rpm xz-utils
          curl -fsSL -o "$RUNNER_TEMP/nfpm.deb" \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/nfpm.deb"

      - name: Import signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::error::Add the GPG_PRIVATE_KEY secret (see README)"; exit 1
          fi
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Fetch release packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/fetch-releases.sh

      - name: Build and sign repository
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: scripts/build-repo.sh

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
